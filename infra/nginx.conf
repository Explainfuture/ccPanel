# Certificate files are installed atomically by the ACME deploy hook. A private
# self-signed certificate may be used only during initial bootstrap.
server {
    listen 80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/ccpanel-acme;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /opt/ccpanel/shared/tls.crt;
    ssl_certificate_key /opt/ccpanel/shared/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    root /opt/ccpanel/current/dist/web;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location ~ ^/(api/|v1/|health$|ready$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
