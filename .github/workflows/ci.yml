name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sftp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y openssh-server && sudo mkdir -p /run/sshd
      - run: pnpm exec tsx scripts/backup-sftp-check.ts
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: test "$(cat dist/schema-version.txt)" = 22
      - run: bash -n scripts/upgrade-product-preview.sh scripts/enable-retention-preview.sh scripts/validate-provision-reports-remote.sh scripts/enable-operational-collection-preview.sh
      - run: bash -n scripts/dlq-ack-failure-remote.sh scripts/capacity-finalize-remote.sh && node --check scripts/dlq-ack-failure-check.mjs
      - run: bash -n scripts/pg-transaction-retry-remote.sh && node --check scripts/pg-transaction-retry-check.mjs
      - run: bash -n scripts/worker-commit-kill-remote.sh && node --check scripts/worker-commit-kill-check.mjs
      - run: bash -n scripts/checkpoint-window-remote.sh && node --check scripts/checkpoint-window-check.mjs
      - run: bash -n scripts/retained-gap-window-remote.sh && node --check scripts/retained-gap-window-check.mjs
      - run: bash -n scripts/pressure-sdk-window-remote.sh && node --check scripts/pressure-sdk-window-check.mjs
      - run: bash -n scripts/partial-produce-window-remote.sh && bash -n scripts/partial-produce-resume-remote.sh && node --check scripts/partial-produce-window-check.mjs
      - run: bash -n scripts/capture-candidate-vps-remote.sh
      - run: bash -n scripts/api-polling-vps-remote.sh && bash -n scripts/api-polling-vps-cleanup.sh
      - run: bash -n scripts/monitor-preservation-vps-remote.sh
      - run: node --check scripts/browser-sdk-native-receiver.mjs && node --check scripts/browser-sdk-native-bfcache.cjs && node --check scripts/browser-sdk-native-bfcache-consent.cjs
      - run: python3 scripts/check-upgrade-guards.py
      - run: python3 scripts/check-retired-drills.py
      - run: python3 scripts/check-schema21-upgrade.py
      - run: python3 scripts/check-schema21-activation.py
      - run: python3 scripts/check-schema22-postmigration.py
      - run: python3 scripts/check-operational-collection-env.py
      - run: bash -n scripts/prepare-release-dependencies.sh && python3 scripts/check-release-dependencies-installer.py
      - run: bash -n scripts/build-release-dependencies.sh && python3 scripts/check-build-release-dependencies.py
      - run: bash -n scripts/import-release-dependencies.sh && python3 scripts/check-import-release-dependencies.py
      - run: python3 scripts/check-release-dependencies.py
      - run: python3 scripts/check-package-release.py
      - run: python3 scripts/check-capacity-preservation.py
      - run: python3 scripts/check-monitor-preservation.py
      - run: python3 scripts/check-capacity-window-remote.py
      - run: pnpm --dir packages/sdk-browser pack --pack-destination ../../artifacts
      - run: pnpm --dir packages/sdk-node pack --pack-destination ../../artifacts
      - run: python3 scripts/check-packed-sdks.py artifacts
      - run: node scripts/node-outbox-crash-check.mjs
      - run: node scripts/node-sdk-real-timeout-check.mjs
      - run: node scripts/check-public-load-accounting.mjs
      - run: node scripts/check-load-first-stop.mjs
      - run: node scripts/check-load-control-lease.mjs
      - run: node scripts/check-load-stop-reader.mjs
      - run: node scripts/check-load-control-integration.mjs
      - run: python3 scripts/check-web-asset-retention.py
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: ccpanel_ci
          POSTGRES_PASSWORD: isolated-ci-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccpanel_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      kafka:
        image: apache/kafka:4.1.2
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 2
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
          KAFKA_LOG_SEGMENT_BYTES: 16777216
          KAFKA_LOG_RETENTION_BYTES: 134217728
          KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 16777216
          KAFKA_NUM_NETWORK_THREADS: 2
          KAFKA_NUM_IO_THREADS: 2
          KAFKA_SOCKET_SEND_BUFFER_BYTES: 65536
          KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 65536
          KAFKA_HEAP_OPTS: -Xms64m -Xmx192m -XX:+UseSerialGC
          KAFKA_JVM_PERFORMANCE_OPTS: -server -Djava.awt.headless=true
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
        options: >-
          --memory 512m
          --health-cmd "KAFKA_HEAP_OPTS='-Xms16m -Xmx64m -XX:+UseSerialGC' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null"
          --health-interval 10s
          --health-timeout 10s
          --health-start-period 20s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y openssh-server && sudo mkdir -p /run/sshd
      - run: node scripts/postgres-ci-check.mjs
        env:
          CCPANEL_PG_CONTAINER: ${{ job.services.postgres.id }}
          CCPANEL_PG_TEST_URL: postgresql://ccpanel_ci:isolated-ci-fixture-only@127.0.0.1:5432/postgres
          CCPANEL_WINDOW_KAFKA_BROKERS: 127.0.0.1:9092
