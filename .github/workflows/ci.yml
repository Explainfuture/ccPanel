name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: test "$(cat dist/schema-version.txt)" = 19
      - run: bash -n scripts/upgrade-product-preview.sh scripts/enable-retention-preview.sh scripts/validate-provision-reports-remote.sh
      - run: pnpm --dir packages/sdk-browser pack --pack-destination ../../artifacts
      - run: pnpm --dir packages/sdk-node pack --pack-destination ../../artifacts
      - run: python3 scripts/check-packed-sdks.py artifacts
      - run: node scripts/node-outbox-crash-check.mjs
      - run: node scripts/check-public-load-accounting.mjs
      - run: python3 scripts/check-web-asset-retention.py
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: ccpanel_ci
          POSTGRES_PASSWORD: isolated-ci-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccpanel_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/postgres-ci-check.mjs
        env:
          CCPANEL_PG_TEST_URL: postgresql://ccpanel_ci:isolated-ci-fixture-only@127.0.0.1:5432/postgres
