<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ccPanel SDK 验收页</title><link rel="stylesheet" href="/sdk-lab.css"></head><body><main><h1>SDK 生命周期验收</h1><p>开发验收页面，只有显式点击才生成测试事件。请使用专门的测试项目与公开写入凭证。</p><form id="config"><label>项目 ID<input name="project" required></label><label>写入凭证<input name="key" required></label><button>初始化 SDK</button></form><section><button id="track" disabled>记录一条待发事件</button><button id="flush" disabled>立即上报</button><button id="status" disabled>查看本地队列</button><button id="revoke" disabled>撤回授权并清空</button></section><pre id="output" aria-live="polite">尚未初始化。</pre><p>本页将定时发送间隔设为 60 秒，以便验证未达阈值时的关闭与恢复。隐藏补发不会删除本地未确认记录。页面离开后没有保证运行的后台进程。</p></main><script type="module" src="/sdk-lab.js"></script></body></html>
